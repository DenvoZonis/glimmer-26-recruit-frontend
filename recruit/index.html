<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>暂未开放</title>
    <style>
        /* ===== 全局重置 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f8fc;
            padding: 24px;
            margin: 0;
        }

        /* ===== 主卡片 ===== */
        .container {
            max-width: 560px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            padding: 52px 44px 48px;
            box-shadow:
                0 20px 60px rgba(0, 20, 40, 0.06),
                0 8px 24px rgba(0, 20, 40, 0.03);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(0, 99, 234, 0.06);
        }

        .container:hover {
            transform: translateY(-3px);
            box-shadow:
                0 28px 72px rgba(0, 20, 40, 0.08),
                0 12px 32px rgba(0, 20, 40, 0.04);
        }

        /* ===== Logo ===== */
        .logo-wrapper {
            margin-bottom: 28px;
        }

        .logo-wrapper img {
            max-width: 148px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-wrapper img:hover {
            transform: scale(1.04);
        }

        /* ===== 主标题 ===== */
        .main-title {
            font-size: 34px;
            font-weight: 600;
            color: #1a2634;
            margin-top: 4px;
            margin-bottom: 14px;
            letter-spacing: -0.3px;
            line-height: 1.25;
        }

        .main-title .highlight {
            color: #0063EA;
        }

        /* ===== 描述文字 ===== */
        .description {
            font-size: 17px;
            line-height: 1.7;
            color: #4a5a6e;
            max-width: 400px;
            margin: 0 auto 32px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* ===== 装饰分隔线 ===== */
        .divider-line {
            width: 48px;
            height: 3px;
            border-radius: 4px;
            background: #0063EA;
            margin: 0 auto 28px;
            opacity: 0.3;
        }

        /* ===== 操作按钮 ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 36px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: #0063EA;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 99, 234, 0.25);
        }

        .btn-primary:hover {
            background: #0052c4;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 99, 234, 0.30);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(0, 99, 234, 0.20);
        }

        .btn-secondary {
            color: #4a5a6e;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.07);
            transform: translateY(-2px);
            color: #1a2634;
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        /* ===== 底部微标 ===== */
        .footer-note {
            margin-top: 36px;
            font-size: 13px;
            color: #8a9aa8;
            letter-spacing: 0.4px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            padding-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .footer-note .dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 520px) {
            .container {
                padding: 36px 24px 36px;
                border-radius: 36px;
            }

            .main-title {
                font-size: 27px;
            }

            .description {
                font-size: 15px;
                padding: 0 4px;
            }

            .logo-wrapper img {
                max-width: 112px;
            }

            .btn {
                padding: 12px 28px;
                font-size: 15px;
                width: 100%;
                justify-content: center;
            }

            .actions {
                flex-direction: column;
                gap: 10px;
            }

            .footer-note {
                font-size: 12px;
                flex-direction: column;
                gap: 4px;
            }

            .footer-note .dot {
                display: none;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 28px 16px 32px;
                border-radius: 28px;
            }

            .main-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container" role="main" aria-labelledby="main-title">

        <!-- Logo -->
        <div class="logo-wrapper">
            <img src="/images/glimmer_logo.png" alt="Glimmer 标志" />
        </div>

        <!-- 主标题 -->
        <h1 id="main-title" class="main-title">
            目前<span class="highlight">暂未开放</span>
        </h1>

        <!-- 描述 -->
        <p class="description">
            敬请期待，很快就会与大家见面。
        </p>

        <!-- 装饰线 -->
        <div class="divider-line" aria-hidden="true"></div>

        <!-- 操作按钮 -->
        <div class="actions">
            <a href="javascript:history.back()" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5" />
                    <path d="M12 19l-7-7 7-7" />
                </svg>
                返回上一页
            </a>
        </div>

        <!-- 底部信息 -->
        <div class="footer-note">
            <span>Glimmer</span>
            <span class="dot" aria-hidden="true"></span>
            <span>即将上线</span>
        </div>

    </div>

</body>
</html>
